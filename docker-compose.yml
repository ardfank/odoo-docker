services:
  web:
    image: odoo:19
    # build: .
    # user: "100:100"
    depends_on:
      - dbhr
    ports:
      - "8069:8069"      # Odoo web interface
      - "8072:8072"      # Odoo longpolling
    # environment:
      # - DB_HOST=dbhr
      # - DB_NAME=odoo
    #   - USER=odoo
    #   - PASSWORD=odoo
    container_name: app
    # entrypoint: []
    volumes:
      - ./Odoo:/var/lib/odoo
      # - ./entrypoint.sh:/mnt/entrypoint.sh
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      # - ./core:/mnt/core
    # command: ["odoo", "-c", "/etc/odoo/servicedesk.conf"]
    # command: ["odoo", "-c", "/etc/odoo/servicedesk.conf", "-i", "base", "--stop-after-init"]
    # command: ["odoo", "-c", "/etc/odoo/odoo.conf", "-i", "base", "--stop-after-init"]

  dbhr:
    image: postgres:17
    container_name: db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./pg_data:/var/lib/postgresql/data